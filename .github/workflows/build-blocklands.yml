name: Build Snipz Games
on:
  workflow_dispatch:
  push:
    paths:
      - "voxel-game/**"
      - ".github/workflows/build-blocklands.yml"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S voxel-game -B voxel-game/build -A x64
      - name: Build
        run: cmake --build voxel-game/build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item voxel-game/build/Release/Blocklands.exe dist/
          Copy-Item voxel-game/build/Release/SnipzCity.exe dist/
          Copy-Item voxel-game/build/Release/SnipzLauncher.exe dist/
          @("SNIPZ LAUNCHER", "Start SnipzLauncher.exe to choose a game.", "Blocklands.exe: voxel sandbox prototype.", "SnipzCity.exe: original city-building prototype.", "Keep all three EXE files in the same folder.", "The apps are unsigned and do not require administrator privileges.") | Set-Content dist/README.txt
      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $scan = Get-Command Start-MpScan -ErrorAction SilentlyContinue
          if ($scan) { Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist" }
      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Set-Content dist/SHA256SUMS.txt
      - name: Upload Snipz bundle
        uses: actions/upload-artifact@v4
        with:
          name: Snipz-Launcher-Windows-x64
          path: dist/
