name: Build Blocklands
on:
  workflow_dispatch:
  push:
    paths:
      - "voxel-game/**"
      - ".github/workflows/build-blocklands.yml"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S voxel-game -B voxel-game/build -A x64
      - name: Build
        run: cmake --build voxel-game/build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item voxel-game/build/Release/Blocklands.exe dist/
          @("BLOCKLANDS", "Start Blocklands.exe directly.", "This build uses raylib's OpenGL 2.1 backend for older GPU/driver compatibility.", "This build is unsigned; SmartScreen may show a reputation warning.", "The game does not require administrator privileges.") | Set-Content dist/README.txt
      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $scan = Get-Command Start-MpScan -ErrorAction SilentlyContinue
          if ($scan) {
            Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist"
            Write-Host "Microsoft Defender scan requested for packaged files."
          } else {
            Write-Warning "Microsoft Defender is unavailable on this runner; scan skipped."
          }
      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Set-Content dist/SHA256SUMS.txt
      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: Blocklands-Windows-x64
          path: dist/

