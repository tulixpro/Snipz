name: Build Blocklands
on:
  workflow_dispatch:
  push:
    paths:
      - "voxel-game/**"
      - ".github/workflows/build-blocklands.yml"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S voxel-game -B voxel-game/build -A x64
      - name: Build
        run: cmake --build voxel-game/build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item voxel-game/build/Release/Blocklands.exe dist/
          Copy-Item voxel-game/build/Release/BlocklandsLauncher.exe dist/
          @("BLOCKLANDS","Start BlocklandsLauncher.exe.","Keep both EXE files in the same folder.") | Set-Content dist/README.txt
      - name: Upload Windows game and launcher
        uses: actions/upload-artifact@v4
        with:
          name: Blocklands-Windows-x64
          path: dist/
