<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>Snipz – gerade offline</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#15345c,#080d18 68%);color:#eef6ff;font:16px/1.6 Inter,system-ui,Arial}.card{width:min(440px,100%);padding:32px 26px;text-align:center;border:1px solid #477bb455;border-radius:26px;background:#101d30eF;box-shadow:0 24px 80px #0008,0 0 36px #2684ff22}.logo{font-size:35px;font-weight:950;letter-spacing:-2px;background:linear-gradient(100deg,#fff,#83c4ff,#2684ff);color:transparent;background-clip:text}.orb{width:92px;height:92px;margin:22px auto;border-radius:28px;display:grid;place-items:center;font-size:42px;background:linear-gradient(145deg,#1675f544,#55b5ff18);border:1px solid #55b5ff55;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px) rotate(3deg);box-shadow:0 12px 30px #2684ff25}}h1{font-size:23px;margin:8px 0}p{color:#a9bdd7;margin:8px 0 22px}.hint{font-size:13px;color:#819ab8;margin-top:18px}button{border:0;border-radius:24px;padding:12px 22px;background:linear-gradient(105deg,#1675f5,#36a7ff);color:white;font-weight:800;font-size:15px;cursor:pointer}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body><main class="card"><div class="logo">snipz</div><div class="orb" aria-hidden="true">☁</div><h1>Sieht so aus, als wärst du offline.</h1><p>Kein Problem! Snipz wartet auf deine Verbindung. Sobald du wieder Internet hast, kannst du den Feed neu laden.</p><button onclick="location.reload()">Erneut versuchen</button><div class="hint">Diese Offline-Seite wurde auf deinem Gerät zwischengespeichert.</div></main></body>
</html>
